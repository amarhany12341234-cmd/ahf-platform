<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AHF - Athletes, Honor, Force</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
        .ahf-gradient { background: linear-gradient(135deg, #dc2626 0%, #7f1d1d 100%); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Navbar -->
    <header class="bg-gray-900 border-b border-gray-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="ahf-gradient text-white font-black text-2xl px-3 py-1 rounded-lg tracking-wider shadow-lg">AHF</div>
                <div>
                    <span class="text-lg font-bold tracking-wide block leading-none">ATHLETES HONOR FORCE</span>
                    <span class="text-xs text-red-500 font-semibold">منصة القوة والانضباط</span>
                </div>
            </div>
            <nav class="hidden md:flex space-x-6 space-x-reverse font-semibold text-sm">
                <a href="#home" onclick="router('home')" class="hover:text-red-500 transition">الرئيسية</a>
                <a href="#challenges" onclick="router('challenges')" class="hover:text-red-500 transition">التحديات</a>
                <a href="#leaderboard" onclick="router('leaderboard')" class="hover:text-red-500 transition">لوحة المتصدرين</a>
                <a href="#programs" onclick="router('programs')" class="hover:text-red-500 transition">البرامج والتدريبات</a>
                <a href="#news" onclick="router('news')" class="hover:text-red-500 transition">الأخبار</a>
                <a href="#join" onclick="router('join')" class="hover:text-red-500 transition">انضم إلينا</a>
            </nav>
            <div id="auth-nav-container" class="flex items-center gap-3">
                <!-- سيتم تعبئته ديناميكياً حسب حالة تسجيل الدخول -->
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main id="app" class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- يتم عرض المحتوى ديناميكياً هنا -->
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 border-t border-gray-800 py-6 text-center text-sm text-gray-400">
        <p>&copy; 2026 AHF (Athletes Honor Force). جميع الحقوق محفوظة.</p>
    </footer>

    <!-- App JavaScript Logic -->
    <script>
        // إعدادات اتصال Supabase bdhnjhvarhpyzdlcyvjg
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let userProfile = null;

        // تهيئة التطبيق
        async class AHFApp {
            static async init() {
                const { data: { session } } = await supabase.auth.getSession();
                currentUser = session?.user || null;
                if (currentUser) {
                    await AHFApp.fetchProfile();
                }
                AHFApp.renderNav();
                router(window.location.hash.replace('#', '') || 'home');
            }

            static async fetchProfile() {
                if (!currentUser) return;
                const { data, error } = await supabase
                    .from('profiles')
                    .select('*')
                    .eq('id', currentUser.id)
                    .single();
                if (!error) userProfile = data;
            }

            static renderNav() {
                const container = document.getElementById('auth-nav-container');
                if (currentUser && userProfile) {
                    container.innerHTML = `
                        <div class="flex items-center gap-3">
                            <span class="text-xs bg-red-900/50 text-red-300 px-2.5 py-1 rounded-full border border-red-700">${userProfile.rank}</span>
                            <a href="#profile" onclick="router('profile')" class="font-bold hover:text-red-400 text-sm">${userProfile.full_name}</a>
                            ${userProfile.is_admin ? '<a href="#admin" onclick="router(\'admin\')" class="bg-red-600 hover:bg-red-700 px-3 py-1 rounded text-xs font-bold transition">لوحة الإدارة</a>' : ''}
                            <button onclick="logout()" class="text-gray-400 hover:text-white text-xs bg-gray-800 px-3 py-1.5 rounded transition">خروج</button>
                        </div>
                    `;
                } else {
                    container.innerHTML = `
                        <a href="#login" onclick="router('login')" class="text-sm font-semibold hover:text-red-500 transition">تسجيل الدخول</a>
                        <a href="#register" onclick="router('register')" class="ahf-gradient text-white px-4 py-2 rounded-lg text-sm font-bold shadow hover:opacity-90 transition">انضم كعضو</a>
                    `;
                }
            }
        }

        // نظام التوجيه (Router) البسيط
        function router(route) {
            window.location.hash = route;
            const app = document.getElementById('app');
            
            switch(route) {
                case 'home':
                    app.innerHTML = `
                        <div class="text-center py-16 space-y-6">
                            <h1 class="text-5xl font-black tracking-tight text-white">منصة <span class="text-red-600">AHF</span> الرياضية</h1>
                            <p class="text-xl text-gray-400 max-w-2xl mx-auto">Athletes, Honor, Force - مجتمع النخبة للانضباط الرياضي، الكالستنكس، وتطوير المقاتلين.</p>
                            <div class="flex justify-center gap-4 pt-4">
                                <a href="#challenges" onclick="router('challenges')" class="ahf-gradient text-white px-8 py-3 rounded-xl font-bold shadow-lg hover:scale-105 transition">تحديات اليوم</a>
                                <a href="#join" onclick="router('join')" class="bg-gray-800 hover:bg-gray-700 text-white px-8 py-3 rounded-xl font-bold border border-gray-700 transition">طلب انضمام</a>
                            </div>
                        </div>
                    `;
                    break;
                case 'login':
                    app.innerHTML = `
                        <div class="max-w-md mx-auto bg-gray-900 border border-gray-800 p-8 rounded-2xl shadow-xl mt-10">
                            <h2 class="text-2xl font-bold mb-6 text-center text-white">تسجيل الدخول إلى AHF</h2>
                            <form onsubmit="handleLogin(event)" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold mb-1 text-gray-400">البريد الإلكتروني</label>
                                    <input type="email" id="email" required class="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-red-600">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold mb-1 text-gray-400">كلمة المرور</label>
                                    <input type="password" id="password" required class="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-red-600">
                                </div>
                                <button type="submit" class="w-full ahf-gradient text-white py-3 rounded-lg font-bold shadow hover:opacity-90 transition">دخول</button>
                                <p id="login-error" class="text-red-500 text-xs text-center mt-2"></p>
                            </form>
                        </div>
                    `;
                    break;
                default:
                    app.innerHTML = `<div class="text-center py-20 text-xl font-bold">الصفحة قيد التفعيل أو غير موجودة.</div>`;
                    break;
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errEl = document.getElementById('login-error');
            
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                errEl.innerText = 'خطأ في البريد الإلكتروني أو كلمة المرور.';
            } else {
                window.location.hash = 'home';
                window.location.reload();
            }
        }

        async function logout() {
            await supabase.auth.signOut();
            window.location.reload();
        }

        window.addEventListener('DOMContentLoaded', () => AHFApp.init());
    </script>
</body>
</html>
